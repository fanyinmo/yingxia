# Java 17 argument files must use the same Windows charset as the test JVM.
# Leave the JVM charset at its native default; Kotlin/XML sources remain UTF-8.
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
# Keep the user's existing Chinese workspace path on Windows.
android.overridePathCheck=true
kotlin.code.style=official
